name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bootstrap digest-pinned sandbox image
        run: ./scripts/bootstrap-pinned-images.sh sandbox

      - name: Compile Python sources
        run: python -m compileall -q scripts tests fixtures verifiers integration

      - name: Validate public surface
        run: python scripts/check-public-surface.py

      - name: Run controller tests
        run: ./scripts/run-local.sh test

      - name: Run deterministic retry workflow
        run: |
          ./scripts/run-local.sh run \
            --scenario retry-success \
            --budget-seconds 120 \
            --max-attempts 2
          ./scripts/run-local.sh verify --latest

      - name: Check working tree formatting
        run: git diff --check
