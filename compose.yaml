name: hermes-incident-workflow

services:
  postgres:
    image: postgres:14.24-alpine@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310
    environment:
      POSTGRES_DB: workflow_mock
      POSTGRES_USER: workflow_mock
      POSTGRES_PASSWORD: ${HIW_POSTGRES_PASSWORD:?controller must set HIW_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_mock -d workflow_mock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [proof]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    mem_limit: 512m
    cpus: 0.50

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    networks: [proof]
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    mem_limit: 1g
    cpus: 1.00

  opensearch:
    image: opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' | grep -Eq '\"status\":\"(yellow|green)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks: [proof]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    mem_limit: 1280m
    cpus: 1.00
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  smoke:
    image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    command: ["python", "/proof/tests/service_smoke.py"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
    environment:
      PYTHONPATH: /proof
    volumes: ["${HIW_WORKSPACE:?set HIW_WORKSPACE}:/proof:ro"]
    networks: [proof]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.50

networks:
  proof:
    internal: true

volumes:
  pg-data:
  kafka-data:
  opensearch-data:
